<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yokai Survivors</title>
<style>
  html, body { margin: 0; padding: 0; background: #07040f; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
         font-family: "Hiragino Kaku Gothic ProN", "Segoe UI", system-ui, sans-serif; }
  #wrap { width: min(96vw, 960px); }
  canvas { width: 100%; height: auto; display: block; border-radius: 10px;
           box-shadow: 0 12px 60px rgba(120, 60, 255, .35), 0 2px 14px rgba(0,0,0,.6);
           background: #0d0722; }
  #hint { color: #8f86b8; font-size: 12.5px; text-align: center; margin-top: 8px; }
  #hint b { color: #cfc6f5; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hint"><b>WASD / Arrow keys</b> move &nbsp;·&nbsp; weapons fire on their own &nbsp;·&nbsp; collect spirit orbs to level up, then pick 1 of 3 blessings with <b>click or 1–3</b> &nbsp;·&nbsp; survive until dawn (180s)</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
